title: "ADNI download guide"
description: "How to download the ADNI dataset (Alzheimer's Disease Neuroimaging Initiative) from LONI IDA: MRI, PET and clinical tables, step by step."
baseurl: "/adni-download-guide"
url: "https://gabrielelozupone.github.io"
repository: "GabrieleLozupone/adni-download-guide"
verified: "28 October 2026"
image: "/assets/img/og.png"

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

plugins:
  - jekyll-relative-links
  - jekyll-optional-front-matter
  - jekyll-titles-from-headings
  - jekyll-seo-tag
  - jekyll-sitemap

relative_links:
  enabled: true
  collections: false

titles_from_headings:
  strip_title: false

defaults:
  - scope: { path: "" }
    values: { layout: "default" }

exclude:
  - CLAUDE.md
  - tests/
  - scripts/*.py
  - scripts/*.sh
  - .gitignore

nav:
  - { n: "", title: "Overview", url: "/" }
  - { n: "0", title: "Rules", url: "/docs/00-rules.html" }
  - { n: "1", title: "Get access", url: "/docs/01-get-access.html" }
  - { n: "2", title: "Clinical tables", url: "/docs/02-tabular-data.html" }
  - { n: "3", title: "Choose images", url: "/docs/03-choose-images.html" }
  - { n: "4", title: "Collection & download", url: "/docs/04-collection-and-download.html" }
  - { n: "5", title: "After the download", url: "/docs/05-after-download.html" }
  - { n: "", sep: true, title: "Troubleshooting", url: "/docs/06-troubleshooting.html" }
  - { n: "", title: "Glossary", url: "/docs/glossary.html" }
  - { n: "", title: "Helper scripts", url: "/scripts/" }
  - { n: "", title: "Using an AI agent", url: "/AGENTS.html" }

steps:
  - { n: "0", title: "Rules", what: "What the Data Use Agreement allows", time: "10 min", url: "/docs/00-rules.html" }
  - { n: "1", title: "Access", what: "IDA account and ADNI application", time: "~2 weeks", url: "/docs/01-get-access.html" }
  - { n: "2", title: "Tables", what: "Clinical data, diagnosis, QC tables", time: "1 hour", url: "/docs/02-tabular-data.html" }
  - { n: "3", title: "Choose images", what: "One image per visit, by Image ID", time: "1 h – 1 day", url: "/docs/03-choose-images.html" }
  - { n: "4", title: "Download", what: "Collections, ZIPs, expiring links", time: "hours – days", url: "/docs/04-collection-and-download.html" }
  - { n: "5", title: "After", what: "Test, unpack, index, NIfTI", time: "hours", url: "/docs/05-after-download.html" }
